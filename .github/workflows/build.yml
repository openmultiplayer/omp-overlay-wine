name: Build Wine overlay DLL

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this build as a GitHub Release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build 32-bit Windows DLL
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          cl /nologo /LD /MT /O2 /W3 /TC ompwine.c /link /OUT:omp-wine.dll gdi32.lib

      - name: Upload DLL
        uses: actions/upload-artifact@v7
        with:
          name: omp-wine.dll
          path: omp-wine.dll
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download DLL artifact
        uses: actions/download-artifact@v8
        with:
          name: omp-wine.dll

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "omp-wine-build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $title = "omp-wine build $env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $notes = "32-bit MSVC build from commit $env:GITHUB_SHA. Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh release create $tag omp-wine.dll --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
